name: test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']  # 3.9 (Apple's python3) runs in the macos job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
      # robot tests skip here (they need macOS osascript); server and CLI tests run
      - run: python -m unittest discover -s tests -v
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the shipped compose example: bind mount ./data (owned by the host user, not by the container user)
      - name: compose up with the bind-mounted data folder
        working-directory: server
        run: |
          cp docker-compose.example.yml docker-compose.yml
          echo "TQ_TOKEN=$(openssl rand -hex 24)" > .env
          mkdir data
          docker compose up -d --build
          ok=0
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && ok=1 && break; sleep 1; done
          if [ "$ok" != 1 ]; then docker compose logs; exit 1; fi
          test -s data/key || { echo "data/key was not written"; docker compose logs; exit 1; }
          test -f data/queue.db || { echo "data/queue.db missing"; exit 1; }
          # survives a restart (the restart loop was the symptom)
          docker compose restart
          ok=0
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && ok=1 && break; sleep 1; done
          [ "$ok" = 1 ] || { docker compose logs; exit 1; }
          # the server process (PID 1 after the entrypoint dropped privileges) must not be root
          uid="$(docker compose exec -T tab-queue sh -c "awk '/^Uid:/{print \$2}' /proc/1/status")"
          echo "server uid: $uid"; test "$uid" = 10001 || { echo "server does not run as uid 10001"; exit 1; }
          docker compose down
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/*.test.js
      # Apple's own python3 (3.9), the one the LaunchAgents use; robot tests drive a fake Chrome through osascript
      - run: /usr/bin/python3 -m unittest discover -s tests -v
