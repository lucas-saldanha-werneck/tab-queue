<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<title>Tab queue</title>
<style>
:root{--bg:#121315;--card:#1b1d21;--line:#2a2d33;--tx:#ecebe7;--mut:#9a9ca3;--acc:#ff4e45;--ok:#5fd38d;--lav:#9b8cff;--chip:#24272c}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,system-ui,sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 16px 150px}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;margin:0}
#n{color:var(--mut);font-size:15px}
#upd{margin-left:auto;color:var(--mut);font-size:13px}
#upd.warn{color:#ffb347}
nav{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
nav button{background:var(--chip);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:7px 13px;
  font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
nav button[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
nav button span{opacity:.65;margin-left:4px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:10px;align-items:center;transition:opacity .25s,transform .25s}
li.out{opacity:0;transform:translateX(40px)}
li.pend{opacity:.7}
.th{position:relative;display:grid;place-items:center;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000;
  color:var(--mut);font-size:26px;font-weight:700;text-decoration:none;text-transform:uppercase}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.lavish{background:#211d3a;color:var(--lav);font-size:15px;text-transform:none;letter-spacing:.5px}
.th.page{background:#20242b}
.t{font-weight:600;color:var(--tx);text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;overflow-wrap:anywhere}
.c{color:var(--mut);font-size:14px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:8px;margin-top:8px}
.btn{font:inherit;font-size:15px;font-weight:600;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;text-decoration:none;
  display:inline-block}
.open{background:var(--acc);color:#fff}
.lavish .open,.k-lavish .open{background:var(--lav)}
.k-page .open{background:#3b6fd8}
.done{background:#2b2e34;color:var(--tx)}
.empty{margin:40px auto;text-align:center;color:var(--mut)}
form{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);
  padding:24px 16px max(16px,env(safe-area-inset-bottom))}
form .wrap{display:flex;gap:8px}
form input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--tx);
  font:inherit;padding:11px 12px}
form button{background:var(--tx);color:var(--bg)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#2b2e34;color:var(--tx);border-radius:12px;padding:12px 14px;display:none;gap:14px;align-items:center;
  box-shadow:0 6px 24px #0008;max-width:calc(100% - 32px);z-index:2}
#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{background:none;border:0;color:var(--ok);font:inherit;font-weight:700;padding:4px 6px;cursor:pointer}
@media (max-width:480px){li{grid-template-columns:96px minmax(0,1fr)}.btn{padding:8px 11px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1 id="h"></h1><span id="n"></span><span id="upd"></span></header>
<nav id="f"></nav>
<ul id="list"></ul>
<p class="empty" id="empty" hidden></p>
</div>
<form id="add" autocomplete="off"><div class="wrap">
<input id="url" type="url" inputmode="url" required>
<button class="btn" type="submit" id="send"></button></div></form>
<div id="toast" role="status"><span id="tmsg"></span><button id="undo" type="button"></button></div>
<script>
const CFG=__TQ_CONFIG__;
const S={
 en:{title:'Queue',all:'All',video:'Videos',lavish:'Lavish',page:'Pages',open:'Open',done:'Done',undo:'Undo',
  closed:'Done. It closes on the Mac.',kept:'Kept in the queue',send:'Send',ph:'Paste a link to open on the Mac',
  sent:'Sent. It opens on the Mac in the background.',already:'Already in the queue',bad:'That is not a link',
  empty:'Nothing in the queue. Tabs of the queue window on the Mac show up here.',opening:'opening on the Mac…',
  waiting:'waiting for the Mac',updated:'updated',offline:'no connection',mac:'Mac last seen',ago:'min ago',
  failed:'Did not work. Try again.',reopen:'Reopening on the Mac',note:'note',video1:'video',page1:'page'},
 pt:{title:'Fila',all:'Tudo',video:'Vídeos',lavish:'Lavish',page:'Páginas',open:'Abrir',done:'Feito',undo:'Desfazer',
  closed:'Feito. Fecha no Mac.',kept:'Voltou para a fila',send:'Mandar',ph:'Cole um link para abrir no Mac',
  sent:'Mandado. Abre no Mac em segundo plano.',already:'Já está na fila',bad:'Isso não é um link',
  empty:'Nada na fila. As abas da janela da fila no Mac aparecem aqui.',opening:'abrindo no Mac…',
  waiting:'esperando o Mac',updated:'atualizado',offline:'sem conexão',mac:'Mac visto há',ago:'min',
  failed:'Não deu certo. Tente de novo.',reopen:'Reabrindo no Mac',note:'nota',video1:'vídeo',page1:'página'}};
const L=S[(CFG.lang||'en').slice(0,2)]||S.en;
const $=id=>document.getElementById(id);
const title=CFG.title||L.title;document.title=title;$('h').textContent=title;
$('url').placeholder=L.ph;$('send').textContent=L.send;$('undo').textContent=L.undo;$('empty').textContent=L.empty;
let data={items:[],pending:[],counts:{}},filter='all',last=null,tt=null,undoMs=6000;const busy=new Set();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,b){const r=await fetch('api/'+p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{cache:'no-store'});
 const j=await r.json().catch(()=>({}));if(!r.ok&&!('result' in j))throw new Error(r.status);return j;}
function toast(msg,canUndo){$('tmsg').textContent=msg;$('undo').style.display=canUndo?'':'none';$('toast').style.display='flex';
 clearTimeout(tt);tt=setTimeout(()=>{$('toast').style.display='none';if(last){busy.delete(last);last=null;}},canUndo?undoMs:3500);}
function thumb(i){
 if(i.thumb)return `<img loading="lazy" src="${esc(i.thumb)}" alt="">`;
 if(i.kind==='lavish')return 'lavish';
 return esc((i.site||'?').replace(/^www\./,'').charAt(0));}
function sub(i){
 if(i.kind==='video')return (i.channel?i.channel+' · ':'')+L.video1;
 if(i.kind==='lavish')return L.note;
 return i.site+' · '+L.page1;}
function render(){
 const items=data.items.filter(i=>!busy.has(i.url));const c={all:items.length,video:0,lavish:0,page:0};
 items.forEach(i=>c[i.kind]=(c[i.kind]||0)+1);
 $('n').textContent=c.all||'';
 $('f').innerHTML=['all','video','lavish','page'].filter(k=>k==='all'||c[k]||filter===k)
  .map(k=>`<button type="button" data-k="${k}" aria-pressed="${filter===k}">${L[k]}<span>${c[k]||0}</span></button>`).join('');
 const shown=items.filter(i=>filter==='all'||i.kind===filter);
 const pend=(filter==='all'?data.pending:[]).map(p=>`<li class="pend k-${esc(p.kind)}"><span class="th ${esc(p.kind)}">${p.kind==='lavish'?'lavish':esc((p.site||'?').charAt(0))}</span>
  <div><span class="t">${esc(p.url)}</span><div class="c">${esc(p.sent?L.opening:L.waiting)}</div></div></li>`).join('');
 $('list').innerHTML=pend+shown.map(i=>`<li class="k-${esc(i.kind)}" data-url="${esc(i.url)}">
  <a class="th ${esc(i.kind)}" href="${esc(i.open_url)}" target="_blank" rel="noopener noreferrer">${thumb(i)}</a>
  <div><a class="t" href="${esc(i.open_url)}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a>
   <div class="c">${esc(sub(i))}</div>
   <div class="row"><a class="btn open" href="${esc(i.open_url)}" target="_blank" rel="noopener noreferrer">${L.open}</a>
   <button class="btn done" type="button">${L.done}</button></div></div></li>`).join('');
 $('empty').hidden=shown.length+pend.length>0;}
async function load(){
 try{data=await api('items');undoMs=Math.max(3000,((data.undo_seconds||10)-2)*1000);render();
  const ago=data.mac_seen_ago;const u=$('upd');
  if(ago!=null&&ago>150){u.textContent=L.mac+' '+Math.round(ago/60)+' '+L.ago;u.className='warn';}
  else{u.textContent=L.updated+' '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});u.className='';}}
 catch(e){$('upd').textContent=L.offline;$('upd').className='warn';}}
$('f').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.k;render();});
$('list').addEventListener('click',async e=>{
 const b=e.target.closest('.done');if(!b)return;const li=b.closest('li'),url=li.dataset.url;
 busy.add(url);li.classList.add('out');
 try{const r=await api('done',{url});if(!r.ok)throw 0;}
 catch(err){busy.delete(url);li.classList.remove('out');toast(L.failed,false);return;}
 setTimeout(render,250);if(last&&last!==url)busy.delete(last);last=url;toast(L.closed,true);});
$('undo').onclick=async()=>{if(!last)return;const u=last;last=null;$('toast').style.display='none';
 try{const r=await api('undo',{url:u});busy.delete(u);toast(r.result==='reopening'?L.reopen:L.kept,false);}catch(e){busy.delete(u);toast(L.failed,false);}
 load();};
$('add').addEventListener('submit',async e=>{e.preventDefault();const v=$('url').value.trim();
 try{const r=await api('add',{url:v});toast(r.result==='queued'?L.sent:r.result==='already'?L.already:L.bad,false);if(r.ok)$('url').value='';}
 catch(err){toast(L.failed,false);}load();});
const q=new URLSearchParams(location.search).get('add');if(q){$('url').value=q;history.replaceState(null,'',location.pathname);}
load();setInterval(load,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
</script>
</body>
</html>
